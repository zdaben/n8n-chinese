name: Manual Auto Translate

on:
  # 纯手动触发：随时可以在 GitHub 网页端点击 Run workflow
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Run AI Auto Translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 scripts/auto_translate.py

      - name: 4. Commit and Push Translated Dictionary
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add languages/zh-CN.json
          if git commit -m "chore(i18n): manual auto-translate missing locale keys [skip ci]"; then
            git push
            echo "✅ 增量词条已成功翻译并推送到 main 分支！"
          else
            echo "ℹ️ 当前字典已是最新，无新增词条需要提交。"
          fi
