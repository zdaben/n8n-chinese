name: Build & Release n8n Localization Package

on:
  # 1. 定时触发：每 6 小时自动检测官方最新发版
  schedule:
    - cron: '0 */6 * * *'

  # 2. 手动触发：留空版本号则自动构建最新 Stable，也可以手动指定特定版本
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific n8n version (Leave empty for latest stable)'
        required: false
        default: ''

jobs:
  # --- Job 1: 快速检测官方版本与发版状态 (约 3~5 秒) ---
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version-decision.outputs.should_build }}
      version: ${{ steps.version-decision.outputs.version }}
    steps:
      - name: Determine Target Version and Release Status
        id: version-decision
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          
          if [ -n "$INPUT_VER" ]; then
            TARGET_VER="$INPUT_VER"
            echo "👉 [Manual Mode] Target version: ${TARGET_VER}"
          else
            echo "🔍 [Auto Mode] Querying official n8n dist-tags (stable track)..."
            TARGET_VER=$(curl -fsSL --connect-timeout 5 --max-time 10 "https://registry.npmjs.org/-/package/n8n/dist-tags" 2>/dev/null | jq -r '.stable // .latest // empty' || true)
            
            if [ -z "$TARGET_VER" ]; then
              echo "🔍 Falling back to GitHub Releases API..."
              TARGET_VER=$(curl -fsSL --connect-timeout 5 --max-time 10 -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/n8n-io/n8n/releases" 2>/dev/null \
                | jq -r '[.[] | select(.prerelease == false and (.tag_name | contains("alpha") or contains("beta") | not))] | .[0].tag_name' \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
                | head -n1 || true)
            fi

            if [ -z "$TARGET_VER" ]; then
              echo "::error::Failed to retrieve target n8n version from upstream sources!"
              exit 1
            fi
            echo "🎯 Detected official stable track version: ${TARGET_VER}"
          fi

          RELEASE_TAG="release/${TARGET_VER}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")

          if [ "$HTTP_CODE" = "200" ] && [ -z "$INPUT_VER" ]; then
            echo "::notice::Release for version v${TARGET_VER} already exists. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "🚀 Target version v${TARGET_VER} is ready for compilation..."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=${TARGET_VER}" >> "$GITHUB_OUTPUT"
          fi

  # --- Job 2: 现场实时增量翻译 + 源码 Patch + Turborepo 编译 + 发版 ---
  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Validate and clone official n8n tag
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          TAG="n8n@${VERSION}"
          echo "Target tag: ${TAG}"

          if ! git ls-remote --exit-code --tags https://github.com/n8n-io/n8n.git "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Git tag [${TAG}] does not exist in official n8n repository!"
            exit 1
          fi

          git clone --depth 1 --branch "$TAG" https://github.com/n8n-io/n8n.git n8n-source

      - name: 3. Parse Node.js and pnpm specifications
        id: runtime
        run: |
          NODE_RANGE=$(jq -r '.engines.node // empty' n8n-source/package.json)
          PNPM_SPEC=$(jq -r '.packageManager // empty' n8n-source/package.json)

          NODE_VERSION=$(echo "$NODE_RANGE" | grep -oE '[0-9]+' | head -n1)
          NODE_VERSION=${NODE_VERSION:-22}

          PNPM_VERSION=$(echo "$PNPM_SPEC" | sed 's/^pnpm@//')
          PNPM_VERSION=${PNPM_VERSION:-10.32.1}

          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pnpm_version=${PNPM_VERSION}" >> "$GITHUB_OUTPUT"

      - name: 4. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node_version }}

      - name: 5. Set up Python for Auto-Translation & Quality Gate
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 6. Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${{ steps.runtime.outputs.pnpm_version }}" --activate
          node --version
          pnpm --version

      - name: 7. Live Auto-Translate missing keys for this version
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          # 如果配置了 AI Key，在打包前现场将针对该版本的新增词条自动翻译补齐
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$DEEPSEEK_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            echo "🚀 [构建前预处理] 正在检测并现场翻译该版本可能包含的增量新词条..."
            python3 scripts/auto_translate.py || true
          fi

      - name: 8. Validate locale, clean empty entries, and inject zh-CN
        run: |
          ZH_SOURCE="languages/zh-CN.json"

          MAIN_I18N_DIR=""
          if [ -f "n8n-source/packages/frontend/@n8n/i18n/src/locales/en.json" ]; then
            MAIN_I18N_DIR="n8n-source/packages/frontend/@n8n/i18n/src/locales"
          elif [ -f "n8n-source/packages/editor-ui/src/plugins/i18n/locales/en.json" ]; then
            MAIN_I18N_DIR="n8n-source/packages/editor-ui/src/plugins/i18n/locales"
          fi

          if [ -z "$MAIN_I18N_DIR" ]; then
            echo "::error::Unable to recognize primary n8n i18n directory structure!"
            exit 1
          fi

          echo "Primary i18n directory: ${MAIN_I18N_DIR}"

          # 清洗并输出安全字典到主目录
          python3 scripts/validate_locale.py \
            "${MAIN_I18N_DIR}/en.json" \
            "${ZH_SOURCE}" \
            "${MAIN_I18N_DIR}/zh-CN.json" \
            "$GITHUB_WORKSPACE/locale_summary.md"

          # 同步至所有可能存在的 locales 目录
          find n8n-source/packages -type d -name "locales" | while read -r dir; do
            if [ -f "${dir}/en.json" ] && [ "$dir" != "$MAIN_I18N_DIR" ]; then
              cp "${MAIN_I18N_DIR}/zh-CN.json" "${dir}/zh-CN.json"
            fi
          done

      - name: 9. Patch n8n i18n runtime for zh-CN (Fail-Closed Assertion)
        run: |
          I18N_INDEX="n8n-source/packages/frontend/@n8n/i18n/src/index.ts"

          if [ ! -f "$I18N_INDEX" ]; then
            echo "::error::i18n index.ts not found: $I18N_INDEX"
            exit 1
          fi

          python3 - "$I18N_INDEX" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # 1. 注入中文语言包 import 语句
          if "import englishBaseText from './locales/en.json';" in text:
              text = text.replace(
                  "import englishBaseText from './locales/en.json';",
                  "import englishBaseText from './locales/en.json';\nimport chineseBaseText from './locales/zh-CN.json';",
                  1,
              )
          elif 'import englishBaseText from "./locales/en.json";' in text:
              text = text.replace(
                  'import englishBaseText from "./locales/en.json";',
                  'import englishBaseText from "./locales/en.json";\nimport chineseBaseText from "./locales/zh-CN.json";',
                  1,
              )
          else:
              print("::error::无法在 index.ts 中定位 englishBaseText import 语句！")
              sys.exit(1)

          # 2. 注册 zh-CN 到 messages 字典中 (保持 locale: 'en' 由运行期 N8N_DEFAULT_LOCALE 动态控制)
          pattern = r'messages\s*:\s*\{\s*en\s*:\s*englishBaseText\s*(,)?\s*\}'
          replacement = r"messages: { en: englishBaseText, 'zh-CN': chineseBaseText, zh: chineseBaseText \1 }"

          new_text, count = re.subn(pattern, replacement, text, count=1)
          if count == 0:
              print("::error::无法在 index.ts 中定位 messages 对象结构进行注册！")
              sys.exit(1)

          path.write_text(new_text, encoding="utf-8")
          print("✅ 成功在 index.ts 中注册 zh-CN 语言模块！")
          PY

          # 3. 严格断言验证
          grep -F "'zh-CN': chineseBaseText" "$I18N_INDEX" >/dev/null || {
            echo "::error::zh-CN runtime registration verification failed!"
            exit 1
          }

      - name: 10. Build dependencies and editor-ui via Turborepo
        working-directory: n8n-source
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=...n8n-editor-ui

          echo "| **Turborepo 构建** | 全依赖拓扑编译 (\`n8n-editor-ui\`) | **✅ PASS** |" >> "$GITHUB_WORKSPACE/locale_summary.md"

      - name: 11. Strictly locate and package dist bundle
        run: |
          mapfile -t DIST_DIRS < <(find n8n-source/packages -type d -path '*/editor-ui/dist')

          if [ "${#DIST_DIRS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one editor-ui dist directory, but found ${#DIST_DIRS[@]}!"
            printf '%s\n' "${DIST_DIRS[@]}"
            exit 1
          fi

          DIST_DIR="${DIST_DIRS[0]}"
          PARENT_DIR="$(dirname "$DIST_DIR")"
          echo "Found exact build output at: ${PARENT_DIR}"

          tar -czf "$GITHUB_WORKSPACE/editor-ui.tar.gz" -C "$PARENT_DIR" dist

      - name: 12. Commit and Push Newly Translated Dictionary (If any)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add languages/zh-CN.json
          if git commit -m "chore(i18n): sync live translated keys for v${{ needs.check.outputs.version }} [skip ci]"; then
            git push
            echo "✅ 现场翻译的新增词条已自动回写推送到 main 分支！"
          else
            echo "没有需要提交的新增词条"
          fi

      - name: 13. Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release/${{ needs.check.outputs.version }}"
          name: "n8n v${{ needs.check.outputs.version }} Localization Build"
          body_path: locale_summary.md
          files: editor-ui.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
